<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TraviPool</title>
<meta name="description" content="Split the cost of a trip with friends, on iPhone.">
<!-- Dane strukturalne (schema.org, JSON-LD). Mówią wyszukiwarce, że to strona
     APLIKACJI na iOS, a nie blog o podróżach.

     `installUrl` i `offers` (cena 0 PLN) dopisane 7.09.2026 po akceptacji
     wersji 1.0 (punkt checklisty #59). ⚠️ Czego tu nadal świadomie NIE MA:
     `aggregateRating`. Bogaty wynik Google dla aplikacji wymaga oceny albo
     recenzji (patrz dokumentacja „Software App"), a ocen w App Store jeszcze
     nie ma. Wpisanie zmyślonych kończy się ręczną karą, a nie lepszą pozycją.
     Dopisać `aggregateRating` dopiero wtedy, gdy oceny faktycznie się pojawią
     - nie wcześniej. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "MobileApplication",
      "@id": "https://travipool.com/#app",
      "name": "TraviPool",
      "description": "Split the cost of a trip with friends, on iPhone.",
      "applicationCategory": ["FinanceApplication", "TravelApplication"],
      "operatingSystem": "iOS",
      "inLanguage": ["pl", "en", "de", "es", "it", "fr"],
      "author": { "@id": "https://travipool.com/#author" },
      "publisher": { "@id": "https://travipool.com/#author" },
      "url": "https://travipool.com/",
      "installUrl": "https://apps.apple.com/app/id6800039461",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PLN" }
    },
    {
      "@type": "Person",
      "@id": "https://travipool.com/#author",
      "name": "Tomasz Socik",
      "email": "support@travipool.com"
    },
    {
      "@type": "WebSite",
      "@id": "https://travipool.com/#website",
      "name": "TraviPool",
      "url": "https://travipool.com/",
      "inLanguage": ["en", "pl"],
      "publisher": { "@id": "https://travipool.com/#author" },
      "about": { "@id": "https://travipool.com/#app" }
    }
  ]
}
</script>
<style>
:root { color-scheme: light dark; --ink:#1c1b18; --muted:#6b6a66; --bg:#fcfbf8;
  --card:#fff; --line:#e5e3dd; --accent:#0f5a3e; }
@media (prefers-color-scheme: dark) { :root { --ink:#eceae4; --muted:#a3a19b;
  --bg:#16171a; --card:#1e2023; --line:#2f3237; --accent:#79c9a0; } }
body { margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
main { max-width:34rem; margin:0 auto; padding:4rem 1.25rem; }
h1 { font-size:1.9rem; margin:0 0 .35rem; }
p.lead { color:var(--muted); margin:0 0 2.5rem; }
a.card { display:block; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:1rem 1.15rem; margin-bottom:.75rem;
  text-decoration:none; color:var(--ink); }
/* Drugi wiersz karty to ta sama nazwa w drugim języku - stąd `span + span`,
   nie `span`: od czasu przełącznika oba wiersze są elementami. */
a.card span + span { display:block; color:var(--muted); font-size:.9rem; margin-top:.15rem; }
.badge { display:inline-block; margin:0 4px 2.5rem; }
.badge img { display:block; height:40px; width:auto; }
footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
footer a { color:var(--accent); }
/* Przełącznik języka: para przycisków w rogu, nie lista rozwijana - dwa języki
   nie potrzebują menu, a widoczna para od razu mówi, że polski w ogóle jest. */
nav.lang { display:flex; justify-content:flex-end; gap:.35rem; margin:0 0 1.5rem; }
nav.lang button { font:inherit; font-size:.85rem; line-height:1; cursor:pointer;
  padding:.35rem .6rem; border-radius:999px; border:1px solid var(--line);
  background:transparent; color:var(--muted); }
nav.lang button[aria-current="true"] { background:var(--card); color:var(--ink); }
</style>
</head>
<body>
<main>
<nav class="lang" aria-label="Language">
  <button type="button" data-lang="en" lang="en">English</button>
  <button type="button" data-lang="pl" lang="pl">Polski</button>
</nav>
<h1>TraviPool</h1>
<p class="lead" data-en="Split the cost of a trip with friends, on iPhone."
   data-pl="Rozliczanie kosztów wspólnej podróży na iPhone.">Split the cost of a trip with friends, on iPhone.</p>
<!-- Odznaka podpięta 7.09.2026 po akceptacji wersji 1.0 przez App Review
     (punkt checklisty #59 w repozytorium ExpenseSplitter, Apple ID 6800039461
     od właściciela). Do tego dnia była CELOWO nieklikalna z dopiskiem „Wkrótce"
     (decyzja właściciela z 19.08.2026): link do nieistniejącego ID kończy się
     błędem App Store, a wytyczne Apple wiążą tę odznakę z aplikacją, którą da
     się pobrać. Adres bez kodu kraju - App Store sam kieruje do sklepu
     użytkownika. Odstęp pod odznaką przejął dawny `p.soon` (2.5rem w .badge).

     Cztery pliki, bo odznaka ma napis W JĘZYKU: `appstore-{en,pl}-{black,white}.svg`.
     To ORYGINALNE assety Apple (Marketing Resources, 119,66×40) - nie wolno ich
     przerysowywać, przekolorowywać ani ściskać; wytyczne dopuszczają wyłącznie
     skalowanie z zachowaniem proporcji, przy wysokości nie mniejszej niż 40 px
     i wolnym marginesem co najmniej 1/10 wysokości dookoła (stąd `margin`
     w .badge). Wariant czarny/biały wybiera `<picture>` po motywie systemu,
     wariant językowy podmienia skrypt na dole - `id="badge"` jest tam po to. -->
<a class="badge" id="badge" href="https://apps.apple.com/app/id6800039461">
  <picture>
    <source srcset="/appstore-en-white.svg" media="(prefers-color-scheme: dark)">
    <img src="/appstore-en-black.svg" alt="Download on the App Store" width="120" height="40">
  </picture>
</a>
<a class="card" href="/privacy/"><span data-en="Privacy Policy" data-pl="Polityka prywatności">Privacy Policy</span><span
   data-en="Polityka prywatności" data-pl="Privacy Policy">Polityka prywatności</span></a>
<a class="card" href="/terms/"><span data-en="Terms of Use" data-pl="Warunki korzystania">Terms of Use</span><span
   data-en="Warunki korzystania" data-pl="Terms of Use">Warunki korzystania</span></a>
<footer>Tomasz Socik · <a href="mailto:support@travipool.com">support@travipool.com</a></footer>
</main>
<script>
// Angielski jest domyślny (życzenie właściciela, 19.08.2026): domena jest
// polska, ale App Store nie jest. Wybór zapamiętuje `localStorage`, więc kto
// raz przełączy na polski, dostaje polski przy każdym powrocie.
//
// ⚠️ Świadomie NIE wykrywamy języka przeglądarki. Automat, którego nie widać,
// bywa mylący - a przełącznik i tak musi być widoczny, więc wykrywanie dokładałoby
// tylko drugi, cichy mechanizm nad tym samym wyborem.
(function () {
  var LANGS = ['en', 'pl'];
  var stored = null;
  try { stored = localStorage.getItem('lang'); } catch (e) { /* tryb prywatny */ }
  var lang = LANGS.indexOf(stored) >= 0 ? stored : 'en';

  function apply(next) {
    lang = next;
    document.documentElement.lang = next;
    // Same napisy - element trzyma oba warianty w data-*, więc nie ma tu
    // słownika do rozjechania się z treścią strony.
    document.querySelectorAll('[data-en][data-pl]').forEach(function (el) {
      el.textContent = el.getAttribute('data-' + next);
    });
    document.querySelectorAll('nav.lang button').forEach(function (b) {
      b.setAttribute('aria-current', String(b.dataset.lang === next));
    });
    // Odznaka App Store: od 7.09.2026 link `a#badge` (wcześniej nieklikalny div).
    var badge = document.getElementById('badge');
    if (badge) {
      var img = badge.querySelector('img');
      var src = badge.querySelector('source');
      img.src = '/appstore-' + next + '-black.svg';
      img.alt = next === 'pl' ? 'Pobierz w App Store' : 'Download on the App Store';
      if (src) src.srcset = '/appstore-' + next + '-white.svg';
    }
    try { localStorage.setItem('lang', next); } catch (e) { /* tryb prywatny */ }
  }

  document.querySelectorAll('nav.lang button').forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.lang); });
  });
  apply(lang);
})();
</script>
</body>
</html>
